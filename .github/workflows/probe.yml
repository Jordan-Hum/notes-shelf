name: probe
on:
  push:
    branches: [probe]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Run scraper (counts only)
        run: |
          python scripts/refresh.py "$RUNNER_TEMP/d.json"
          python - <<'PY'
          import json, os
          from collections import defaultdict
          d = json.load(open(os.environ['RUNNER_TEMP'] + '/d.json'))
          s = defaultdict(lambda: defaultdict(int))
          for n in d['notes']:
              b = n['bank']; s[b]['count'] += 1
              for k in ('rate','barrier','callThr','cpnBarrier','mat','fee'):
                  if n.get(k) not in (None, ''): s[b][k] += 1
              s[b]['type:' + n['type']] += 1
          for b, v in s.items(): print(b, dict(v))
          print(d['meta'])
          PY
